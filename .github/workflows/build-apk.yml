name: Build debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set timestamp
        id: ts
        run: echo "value=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Rename APK with timestamp
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/nba-watchability-${{ steps.ts.outputs.value }}.apk"

      - name: Create release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ steps.ts.outputs.value }}" \
            "app/build/outputs/apk/debug/nba-watchability-${{ steps.ts.outputs.value }}.apk" \
            --repo "${{ github.repository }}" \
            --title "Debug build ${{ steps.ts.outputs.value }}" \
            --notes "Automated debug build from ${{ github.sha }} on ${{ github.ref_name }}." \
            --prerelease
