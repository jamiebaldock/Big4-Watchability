name: Deploy iOS app to TestFlight

# Manual-only (no push trigger) - unlike build-ios.yml's unsigned simulator
# build, this needs a full set of Apple signing secrets that don't exist
# until the Apple Developer Program enrollment clears and the one-time setup
# in docs/ios-testflight-setup.md is done. This has never actually been
# dispatched - the exact xcodebuild/altool flags below are the current
# documented pattern as of 2026-09, not verified against a real run yet.
# Following this repo's own CI practice (push one focused thing, confirm
# green before building on top): the first real dispatch is the test: expect
# to iterate on this file once real errors show up, same as build-ios.yml's
# own history. Do NOT wire this to `on: push` until it has gone green at
# least once - a broken signed-build workflow failing on every push would
# just be noise on top of the working unsigned build-ios.yml.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Three separate Info.plist/project.yml edits in a row produced a
      # byte-for-byte IDENTICAL archived Info.plist (same "1"/"1.0" values,
      # same missing keys) - meaning our source edits may not even be
      # reaching the generated project. Check that BEFORE building again.
      # Using wc/md5 markers instead of eyeballing line numbers in the log,
      # since a scrolled screenshot of raw `cat` output is easy to miscount.
      - name: Verify generated project (debug)
        run: |
          echo "=== SOURCE PLIST START ==="
          cat Big4Watchability/Resources/Info.plist
          echo "=== SOURCE PLIST END (lines: $(wc -l < Big4Watchability/Resources/Info.plist), md5: $(md5 -q Big4Watchability/Resources/Info.plist)) ==="
          echo "=== Any OTHER file named Info.plist anywhere in the checkout ==="
          find . -iname "Info.plist"
          echo "=== pbxproj INFOPLIST_FILE / GENERATE_INFOPLIST_FILE / version lines ==="
          grep -n "INFOPLIST_FILE\|GENERATE_INFOPLIST_FILE\|CURRENT_PROJECT_VERSION\|MARKETING_VERSION" Big4Watchability.xcodeproj/project.pbxproj
          echo "=== Resolved build settings - Debug ==="
          xcodebuild -showBuildSettings -configuration Debug -project Big4Watchability.xcodeproj -scheme Big4Watchability -destination 'generic/platform=iOS' 2>&1 | grep -i "infoplist\|current_project_version\|marketing_version\| configuration "
          echo "=== Resolved build settings - Release ==="
          xcodebuild -showBuildSettings -configuration Release -project Big4Watchability.xcodeproj -scheme Big4Watchability -destination 'generic/platform=iOS' 2>&1 | grep -i "infoplist\|current_project_version\|marketing_version\| configuration "

      # Standard "decode base64 secret -> temp keychain" pattern (same one
      # GitHub's own docs and most iOS CI tutorials use) - keeps the actual
      # certificate/profile files out of the repo entirely, only ever living
      # as GitHub Actions secrets. See docs/ios-testflight-setup.md for how
      # to produce each of these three values without ever touching a Mac
      # (the CSR step uses plain openssl, works on Windows/Linux).
      - name: Import signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/dist_cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH

          # Fresh, throwaway keychain per CI run - never touches whatever
          # keychain state a real Mac would carry between runs.
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Archive (signed)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Big4Watchability.xcodeproj \
            -scheme Big4Watchability \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Big4Watchability.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${{ secrets.IOS_APPLE_TEAM_ID }}" \
            | tee $RUNNER_TEMP/archive.log

      # The archive build log names the EXACT input file Xcode read for
      # every Info.plist/asset-catalog processing step - direct evidence
      # of what actually happened, rather than inferring from settings.
      - name: Grep archive log for Info.plist / asset catalog processing (debug)
        run: |
          echo "=== ProcessInfoPlistFile lines (shows real input path used) ==="
          grep -A2 "ProcessInfoPlistFile" $RUNNER_TEMP/archive.log || echo "NO ProcessInfoPlistFile LINE FOUND AT ALL"
          echo "=== CompileAssetCatalog / actool lines ==="
          grep -A2 "CompileAssetCatalog\|actool" $RUNNER_TEMP/archive.log || echo "NO CompileAssetCatalog LINE FOUND AT ALL"
          echo "=== Any warning/error mentioning Info.plist or Assets.xcassets ==="
          grep -i "warning.*info.plist\|error.*info.plist\|warning.*xcassets\|error.*xcassets" $RUNNER_TEMP/archive.log || echo "none"
          echo "=== Processed-Info.plist files under DerivedData, dumped ==="
          find ~/Library/Developer/Xcode/DerivedData -name "Processed-Info.plist" -exec echo "--- {} ---" \; -exec plutil -p {} \;

      # Diagnostic only - added after two upload rejections (orientation +
      # icon errors) that shouldn't be possible given the source files are
      # verified correct on disk. Rather than guess a third time, dump the
      # ACTUAL built product's Info.plist and asset catalog so we can see
      # what Apple is really validating instead of what we assume shipped.
      - name: Inspect built archive (debug)
        run: |
          APP_PATH="$RUNNER_TEMP/Big4Watchability.xcarchive/Products/Applications/Big4Watchability.app"
          echo "=== Every Info.plist under DerivedData (any stray/shadow copy) ==="
          find ~/Library/Developer/Xcode/DerivedData -iname "Info.plist" 2>/dev/null
          echo "=== Full Info.plist in the built .app ==="
          plutil -p "$APP_PATH/Info.plist"
          echo "=== Assets.car icon entries ==="
          find "$APP_PATH" -name "Assets.car" -exec xcrun assetutil --info {} \; | grep -i -A5 "AppIcon\|SizeClass\|\"Name\"" || echo "NO Assets.car FOUND"
          echo "=== App bundle top-level contents ==="
          ls -la "$APP_PATH"

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.IOS_APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.nbawatchability.app</key>
              <string>${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Big4Watchability.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      # App Store Connect API key auth (not Apple ID + app-specific password)
      # so this never needs 2FA/interactive login - the key itself is scoped
      # read/write to just this account via App Store Connect > Users and
      # Access > Integrations > App Store Connect API.
      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$API_KEY_BASE64" | base64 --decode -o ~/private_keys/AuthKey_$API_KEY_ID.p8
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/export/Big4Watchability.ipa \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"
