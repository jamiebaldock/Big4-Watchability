name: Big4Watchability
options:
  bundleIdPrefix: com.nbawatchability
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Release: release
targets:
  Big4Watchability:
    type: application
    platform: iOS
    # Assets.xcassets moved from `resources:` to `sources:` - the archive
    # build log proved actool/CompileAssetCatalog never ran at all under
    # `resources:` (even pointed directly at the .xcassets path alone),
    # which is why Assets.car never made it into the bundle. `sources:`
    # entries get full type-aware handling (splitting compile-sources vs.
    # copy-bundle-resources, recognizing .xcassets as an asset catalog
    # needing compilation) where `resources:` is a blunter copy mechanism.
    # Resources/ has nothing else in it now that Info.plist is gone, so
    # the separate `resources:` block is removed entirely.
    sources:
      - path: Big4Watchability/Sources
      - path: Big4Watchability/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nbawatchability.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Apple's own error (90713) named this directly: an asset-catalog
        # app icon (ASSETCATALOG_COMPILER_APPICON_NAME above) also needs
        # this companion key set to the same name, or the validator falls
        # back to expecting old-style loose icon files in the bundle root
        # instead - which is what the "missing icon file...outside of an
        # asset catalog" errors (90022/90023) were actually describing.
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        # Six straight fix attempts against a custom Info.plist file
        # produced byte-identical archived output every time despite the
        # build log proving xcodebuild read the right source with macro
        # expansion on - an unexplained, unreproducible-by-inspection
        # failure. Switched to Xcode's fully build-setting-driven
        # Info.plist generation instead (the modern default for new Xcode
        # projects, no physical plist file at all), since these settings
        # are independently confirmed to be read correctly.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Big4Watchability
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Simplified to one universal orientation set for all idioms
        # rather than iPhone-portrait-only + iPad-all-4, to avoid betting
        # a further cycle on whether INFOPLIST_KEY_*~ipad/~iphone idiom
        # suffixes are honored by Xcode's synthesis mechanism the same
        # way they are for a hand-written Info.plist key.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # The app only ever makes standard HTTPS/TLS calls (confirmed in
        # the F8 pre-submission audit - no custom/proprietary crypto
        # anywhere in ios/), which is Apple's "exempt" encryption category.
        # Declaring this up front skips the export-compliance prompt App
        # Store Connect otherwise asks on every single build upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
