name: Big4Watchability
options:
  bundleIdPrefix: com.nbawatchability
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Release: release
# Added 2026-09-21 with the Alerts port and the iOS ad banner. Both are
# Google SDKs and both are pinned to a major version rather than left
# floating: there is no local compile loop on this machine, so an
# unannounced breaking rename in a minor bump would only ever surface as a
# red CI run with no way to bisect it quickly.
#
# UserMessagingPlatform is declared as its own package rather than relying
# on it arriving transitively with GoogleMobileAds - it is imported directly
# by AdsConsentManager.swift, and an implicitly-available module is exactly
# the kind of thing that breaks on a dependency's internal restructure.
# (GoogleMobileAds does depend on it, constrained to 1.1.0..<4.0.0, so the
# 3.x pin below sits inside that range and can't force a conflict.)
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.0.0
targets:
  Big4Watchability:
    type: application
    platform: iOS
    # Assets.xcassets moved from `resources:` to `sources:` - the archive
    # build log proved actool/CompileAssetCatalog never ran at all under
    # `resources:` (even pointed directly at the .xcassets path alone),
    # which is why Assets.car never made it into the bundle. `sources:`
    # entries get full type-aware handling (splitting compile-sources vs.
    # copy-bundle-resources, recognizing .xcassets as an asset catalog
    # needing compilation) where `resources:` is a blunter copy mechanism.
    # Resources/ has nothing else in it now that Info.plist is gone, so
    # the separate `resources:` block is removed entirely.
    sources:
      - path: Big4Watchability/Sources
      - path: Big4Watchability/Resources/Assets.xcassets
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleMobileAds
        product: GoogleMobileAds
      # Product is GoogleUserMessagingPlatform; the MODULE you import is
      # plain UserMessagingPlatform. They differ, and naming the module here
      # fails the build with "Missing package product" (CI run #47).
      - package: UserMessagingPlatform
        product: GoogleUserMessagingPlatform
    # aps-environment is the one entitlement push needs. XcodeGen writes this
    # file out; the value is deliberately "development" - Xcode's automatic
    # signing rewrites it to "production" when building for distribution, so
    # hardcoding production here would break local/simulator debug builds
    # without improving the TestFlight one.
    entitlements:
      path: Big4Watchability/Big4Watchability.entitlements
      properties:
        aps-environment: development
    # Signing lives here, attached to this ONE target, rather than on
    # xcodebuild's command line where it would apply to the SPM package
    # targets too and fail the archive. See Signing.xcconfig's header.
    # Empty in the repo; filled from secrets at archive time.
    configFiles:
      Debug: Big4Watchability/Signing.xcconfig
      Release: Big4Watchability/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nbawatchability.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "12"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # DEVELOPMENT_TEAM and CODE_SIGN_STYLE deliberately absent (run #28):
        # Xcode resolves build settings command line > TARGET settings >
        # xcconfig. While signing was passed on xcodebuild's command line
        # these two were outranked and harmless, which is why an empty
        # DEVELOPMENT_TEAM sat here for eleven green dispatches. Now that
        # signing comes from Signing.xcconfig (a base configuration), a
        # target-level DEVELOPMENT_TEAM: "" would OUTRANK it and blank the
        # team out again - "Signing requires a development team".
        # Leaving both unset lets the xcconfig own signing entirely, and
        # costs the unsigned CI build nothing since it passes
        # CODE_SIGNING_ALLOWED=NO anyway.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Apple's own error (90713) named this directly: an asset-catalog
        # app icon (ASSETCATALOG_COMPILER_APPICON_NAME above) also needs
        # this companion key set to the same name, or the validator falls
        # back to expecting old-style loose icon files in the bundle root
        # instead - which is what the "missing icon file...outside of an
        # asset catalog" errors (90022/90023) were actually describing.
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        # Six straight fix attempts against a custom Info.plist file
        # produced byte-identical archived output every time despite the
        # build log proving xcodebuild read the right source with macro
        # expansion on - an unexplained, unreproducible-by-inspection
        # failure. Switched to Xcode's fully build-setting-driven
        # Info.plist generation instead (the modern default for new Xcode
        # projects, no physical plist file at all), since these settings
        # are independently confirmed to be read correctly.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Big4Watchability
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Simplified to one universal orientation set for all idioms
        # rather than iPhone-portrait-only + iPad-all-4, to avoid betting
        # a further cycle on whether INFOPLIST_KEY_*~ipad/~iphone idiom
        # suffixes are honored by Xcode's synthesis mechanism the same
        # way they are for a hand-written Info.plist key.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # The app only ever makes standard HTTPS/TLS calls (confirmed in
        # the F8 pre-submission audit - no custom/proprietary crypto
        # anywhere in ios/), which is Apple's "exempt" encryption category.
        # Declaring this up front skips the export-compliance prompt App
        # Store Connect otherwise asks on every single build upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # --- Alerts (2026-09-21) ---
        # Lets a silent content-available push wake the app so the in-app
        # banner can be drawn for the "in_app" delivery pref. Space-separated
        # like UISupportedInterfaceOrientations above - that's how Xcode's
        # plist synthesis expresses an array-valued key.
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        # --- Ads (2026-09-21) ---
        # Google's official iOS TEST application id, paired with the test
        # banner unit in AdBannerView.swift. Both get swapped together once
        # James registers an iOS app in the existing AdMob account - ad unit
        # ids are per-platform, so Android's real ids cannot be reused.
        INFOPLIST_KEY_GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        # Shown in the App Tracking Transparency prompt, which the UMP SDK
        # presents as part of the consent flow. Required or the app crashes
        # the moment ATT is requested.
        INFOPLIST_KEY_NSUserTrackingUsageDescription: This lets us show ads that are more relevant to you. Big4 Watchability works exactly the same either way.
        # DELIBERATELY NOT SET: SKAdNetworkItems. It is an array of
        # dictionaries, which INFOPLIST_KEY_* synthesis cannot express, and
        # adding it back would mean reintroducing a physical Info.plist file
        # - the exact thing that cost nine failed upload attempts on
        # 2026-09-20 before GENERATE_INFOPLIST_FILE fixed it. It is not
        # required for the app to build, pass review, or serve ads: it only
        # improves install-attribution for advertisers running campaigns.
        # Revisit only if ad revenue is measurably suffering for it.
